events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    # Per-address limits for the two routes that accept large bodies (T8,
    # docs/plans/t8-image-support.md §G). Starlette buffers a whole multipart body
    # before any handler or auth check runs, so nginx is the real bound. They act
    # before the body is read.
    limit_req_zone $binary_remote_addr zone=bz_bodies:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=bz_conn:10m;

    server {
        listen 80;
        server_name localhost;

        # API and WebSocket traffic → FastAPI backend. The default 1 MB body limit
        # applies here, including the anonymous guest endpoints.
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Image upload and replace: 2 MiB images plus multipart overhead (the
        # backend enforces 2 MiB itself). Regex locations take precedence over /api/.
        location ~ ^/api/games/[0-9]+/images(/[^/]+)?$ {
            client_max_body_size 3m;
            limit_req zone=bz_bodies burst=10 nodelay;
            limit_conn bz_conn 5;
            limit_req_status 429;
            limit_conn_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Game import: bundles up to 40 MiB that may decode up to 50 images.
        location ~ ^/api/(courses/[0-9]+/games/import|admin/games/import)$ {
            client_max_body_size 41m;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            limit_req zone=bz_bodies burst=10 nodelay;
            limit_conn bz_conn 5;
            limit_req_status 429;
            limit_conn_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Host React app — static files
        location /host/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /host/index.html;
        }

        # Player React app — static files
        location /player/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /player/index.html;
        }

        # Admin React app — static files
        location /admin/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /admin/index.html;
        }

        # Root redirect
        location = / {
            return 302 /player/;
        }
    }
}
